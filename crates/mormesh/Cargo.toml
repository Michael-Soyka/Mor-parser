[package]
name = "mormesh"
version = "0.1.0"
edition = "2024"

[features]
gltf = [ "dep:serde_json" ]

[dependencies]
encoding_rs = "0.8.42"
flate2 = "1.1.10"
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"

[dev-dependencies]
gltf = { version = "1.4.1", default-features = false, features = [ "names", "utils" ] }
image = { version = "0.25.10", default-features = false, features = [ "png" ] }
mortex = { path = "../mortex" }
morvfs = { path = "../morvfs" }

[[example]]
name = "mesh2gltf"
required-features = [ "gltf" ]

[[test]]
name = "gltf"
required-features = [ "gltf" ]
