name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  EXAMPLES: extract tex2png text2png mesh2obj mesh2gltf scene2gltf

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cargo.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: cargo
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            ext: .exe
          - os: ubuntu-latest
            platform: linux-x64
            ext: ''
          - os: macos-latest
            platform: macos-arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: Mor-Parsers-${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --all-features --locked

      - run: cargo build --release --workspace --all-features --examples --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = $env:EXAMPLES.Split( ' ' ) | ForEach-Object { "target/release/examples/$_${{ matrix.ext }}" }
          Compress-Archive -Path $files -DestinationPath "$env:PACKAGE.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "$PACKAGE.tar.gz" -C target/release/examples $EXAMPLES

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [ version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Mor-Parsers-${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
